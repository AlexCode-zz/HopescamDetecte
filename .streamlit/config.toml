[theme]
primaryColor = "#DB2777"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#FDF2F8"
textColor = "#111827"
linkColor = "#BE185D"
borderColor = "#FBCFE8"
baseRadius = "0.75rem"
buttonRadius = "0.75rem"
showWidgetBorder = true
showSidebarBorder = false
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap"
baseFontSize = 15
headingFontSizes = ["2.2rem", "1.6rem", "1.25rem", "1.1rem", "1rem", "0.875rem"]
headingFontWeights = [700, 700, 600, 600, 500, 500]
paddingTop = "1.5rem"
paddingBottom = "2rem"

[theme.light]
primaryColor = "#DB2777"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#FDF2F8"
textColor = "#111827"
borderColor = "#FBCFE8"
chartCategoricalColors = ["#DB2777", "#7C3AED", "#0F766E", "#F59E0B", "#2563EB", "#DC2626", "#64748B"]

[theme.dark]
primaryColor = "#F472B6"
backgroundColor = "#0F0A12"
secondaryBackgroundColor = "#1C1220"
textColor = "#F5F3F7"
borderColor = "#3B2438"
linkColor = "#F9A8D4"
chartCategoricalColors = ["#F472B6", "#A78BFA", "#2DD4BF", "#FBBF24", "#60A5FA", "#F87171", "#94A3B8"]

[theme.light.sidebar]
backgroundColor = "#FDF2F8"
secondaryBackgroundColor = "#FCE7F3"
textColor = "#111827"
borderColor = "#FBCFE8"
primaryColor = "#DB2777"

[theme.dark.sidebar]
backgroundColor = "#140D17"
secondaryBackgroundColor = "#241827"
textColor = "#F5F3F7"
borderColor = "#3B2438"
primaryColor = "#F472B6"

[server]
headless = true
enableCORS = true
enableXsrfProtection = true
maxUploadSize = 15

[browser]
gatherUsageStats = false
